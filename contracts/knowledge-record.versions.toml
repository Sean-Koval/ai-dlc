# Published record format versions (KAN-504). Edited by hand, never generated.
#
# `sha256` is the SHA-256 of knowledge-record.schema.json in canonical JSON:
# json.dumps(schema, sort_keys=True, separators=(",", ":")) encoded as UTF-8.
# A vendored copy that claims `x-format-version` N must hash to `sha256` of N.
#
# Any change to the schema bumps FORMAT_VERSION and appends a new table here.
# Records forbid unknown keys, so even an added field fails an older reader.
# A published table never changes; scripts/check_generated.py enforces the rest.

[versions.1]
