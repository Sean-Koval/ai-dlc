schema = 1
id = "tracker-rest-fallback"
title = "GitHub Issues tracker falls back to REST when GraphQL is refused"
scope = "When the GraphQL endpoint itself is refused, the github-issues adapter reads, closes, reopens and links issues and verifies the viewer through REST so work finish completes; the configured Project is reported unreconciled and planning operations (start in_progress, prepare, reconcile) still fail visibly. Excludes REST Projects support and find/create fallbacks."
requires_spec = true
spec_reason = "Changes GT-02, which required a failed Project verification to fail rather than fall back to issue-only behavior."
acceptance = [
    "work finish completes against a closed or open issue when GraphQL is refused, reporting the Project as unreconciled",
    "Planning operations and non-refusal GraphQL failures (scopes, rate limits, 5xx) still fail without fallback",
]
reviewed = true
depends_on = []
requirements = [
    "GT-02",
]

