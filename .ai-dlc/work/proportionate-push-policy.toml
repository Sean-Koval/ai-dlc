schema = 1
id = "proportionate-push-policy"
title = "Make optional push policy support an explicit lightweight delivery path"
scope = "Reconcile optional bound-push behavior with the documented no-record workflow through an explicit project-owned policy, preserving the existing strict default and tracked-delivery requirements. Exclude heuristic exemptions, machine-policy weakening and additional per-branch bookkeeping."
requires_spec = true
spec_reason = "Changes observable setup, guidance, policy or delivery behavior; formal scenarios define the compatibility and evidence boundaries."
acceptance = [
    "Omitted policy preserves current strict behavior for projects selecting bound-push.",
    "An explicitly selected lightweight policy permits a truly unbound branch to publish without manufacturing a tracker record.",
    "Branches associated with invalid, unreviewed or incomplete tracked work still refuse bound operations; ambiguous/malformed records cannot create an exemption.",
    "Machine/personal overrides cannot weaken project policy; unsupported policy/client combinations fail actionably before generated settings change.",
    "Guidance and regression coverage agree for strict, lightweight, tracked, unbound and malformed cases; completion gates remain unchanged.",
]
reviewed = true
depends_on = []
requirements = [
    "PPP-01",
    "PPP-02",
    "PPP-03",
    "PPP-04",
]

