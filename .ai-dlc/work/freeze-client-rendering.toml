schema = 1
id = "freeze-client-rendering"
title = "Freeze client rendering targets and replace exact hook version gating with a floor"
scope = "Remove the unused render target parameter and the devcontainer, codex-cloud and claude-cloud execution targets, refuse them with a hangar pointer, replace exact client-version hook fixtures with a per-client minimum version and align client pins with hangar's harness lock. Exclude managed-section extraction, a shared adapter library, the capabilities file rename and automatic lock synchronization."
requires_spec = true
spec_reason = "Removes accepted execution targets and changes when required hooks render; formal scenarios define the refusal and floor semantics."
acceptance = [
    "render_agents, _render_agents and render_windows accept no target parameter, and agents render --check stays clean on this repository.",
    "project setup --target codex-cloud refuses with a message naming hangar and the supported targets.",
    "A claude-code version of 2.1.296 with required stop-reminder renders; 1.9.0 refuses with requires claude-code >= 2.1.0; an unset version renders with a warning.",
    "modules/catalog.toml pins claude-code 2.1.296 and codex 0.162.1 with a source comment, and scripts/check_client_pins.py diffs them against a given lock.",
    "The freeze comment and the ADR 0001 line exist; migration notes cover removed targets, the hook floor and the pins.",
]
reviewed = true
