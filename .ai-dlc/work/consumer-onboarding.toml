schema = 1
id = "consumer-onboarding"
title = "Guide consumers and coding harnesses through the correct setup path"
scope = "Distinguish installing/using AI-DLC for a team repository from contributing to the engine, with platform/client preflight and explicit target selection that composes existing setup/enrollment/adoption services. Exclude a new orchestrator and implicit adoption of the engine maintainer's accounts."
requires_spec = true
spec_reason = "Changes observable setup, guidance, policy or delivery behavior; formal scenarios define the compatibility and evidence boundaries."
acceptance = [
    "The consumer journey identifies OS/shell, selected client and intended repository before recommending setup actions.",
    "A cloned engine installation is not mistaken for the work project and does not select its personal tracker/accounts for downstream work.",
    "Consumer readiness uses bounded installation and selected-project checks; contributor setup still exposes full engine verification.",
    "Unsupported native capabilities are named before mutation; the guide does not silently prescribe WSL or claim Windows works before qualification.",
    "Preview/apply, authored-content preservation and explicit credential/account setup remain delegated to existing services.",
]
reviewed = true
