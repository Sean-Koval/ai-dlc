schema = 1
id = "error-and-result-envelope"
title = "Adopt one exception base and one service result envelope for the CLI and MCP"
scope = "Introduce ai_dlc.errors.AiDlcError as the single base for the framework's own exception classes and derive the existing custom classes from it while keeping their ValueError or RuntimeError compatibility bases. Replace the repeated four-type except blocks in cli.py with one failure handler and one exit-code mapping. Define the service result envelope (a status string as the canonical success signal, with the legacy valid, ready, passed and clean keys read through one accessor until migrated), generate its contract schema alongside the provider contracts, and document it in docs/architecture.md. Command output for every existing command is unchanged; converting the hundreds of bare ValueError raises is left to follow-up work."
requires_spec = false
spec_reason = "Internal error-handling structure and documentation; command output and provider wire behaviour are unchanged."
acceptance = [
    "Every custom exception class in src/ai_dlc derives from AiDlcError and cli.py contains one failure handler instead of repeated four-type except blocks.",
    "docs/architecture.md documents the result envelope and the generated contract for it is checked by scripts/check_generated.py.",
    "All required checks pass.",
]
reviewed = true
