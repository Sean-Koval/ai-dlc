schema = 1
id = "release-publication"
title = "Publish a versioned AI-DLC release with bootstrap artifacts"
scope = "Publish hash-bound release assets from a Git tag through the release workflow, keep the release manifest beside the installed engine, and let generated projects receive it so their bootstrap and CI can run outside this checkout. Deliver the approved requirements using existing AI-DLC boundaries."
requires_spec = true
spec_reason = "Adds observable release-mode bootstrap behaviour and a publication procedure whose assets downstream projects depend on."
acceptance = [
    "A reproducible procedure SHALL produce the wheel, the hash-bound manifest and the release bootstrap assets from a tagged commit.",
    "A clean-environment run SHALL install AI-DLC from release assets and scaffold and check a python preset project.",
    "The template's bootstrap SHALL no longer depend on an unpublished location once the maintainer runs the documented publish step.",
    "docs/release-verification.md SHALL record precisely which outstanding obligations this release satisfies and which remain.",
]
reviewed = true
depends_on = []
requirements = [
    "RP-01",
    "RP-02",
    "RP-03",
]

