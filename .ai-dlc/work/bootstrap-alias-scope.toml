schema = 1
id = "bootstrap-alias-scope"
title = "Keep source bootstrap from repointing the global ai-dlc aliases"
scope = "Publish the shared bootstrap aliases only on request in source mode and report which checkout they run. Deliver the approved requirements using existing AI-DLC boundaries."
requires_spec = true
spec_reason = "Observable bootstrap alias publication, reporting and diagnostics changes approved by the user."
acceptance = [
    "Source bootstrap of a linked worktree or another checkout SHALL leave an existing global alias unchanged unless publication is requested.",
    "Explicit opt-in SHALL still repoint the aliases, and release mode SHALL keep publishing them.",
    "Bootstrap output and project workspace diagnostics SHALL identify which checkout the global alias runs.",
    "Tests SHALL cover a linked worktree, a second checkout and the opt-in path, and guidance SHALL be updated.",
]
reviewed = true
