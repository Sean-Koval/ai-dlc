schema = 1
id = "windows-portable-core"
title = "Native Windows: make core execution and filesystem services portable"
scope = "Provide safe native Windows core services for the ordinary project and work paths, preserving Unix behavior, explicit shell semantics, concurrent-write exclusion, authored-content protection and recovery. Exclude installers, full workstation catalog support and native-client qualification."
requires_spec = true
spec_reason = "Changes observable setup, guidance, policy or delivery behavior; formal scenarios define the compatibility and evidence boundaries."
acceptance = [
    "Core CLI/project services import and execute on Windows 11 x64 without Unix-only module failures or a mandatory POSIX shell.",
    "Native command execution has explicit, validated semantics; existing string commands retain their documented POSIX meaning and are never silently reinterpreted.",
    "Windows and existing Unix regression cases preserve concurrent-write locking, containment, edited-file refusal and recovery; unsafe reparse/symlink cases fail without writes.",
    "Meaningful passing and failing project checks retain exact required IDs, revision/configuration bindings, and truthful failure outcomes.",
    "A real native Windows CI lane exercises the supported core path; mocks and successful Unix CI are not reported as Windows qualification.",
]
reviewed = true
