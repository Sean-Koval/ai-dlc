schema = 1
id = "work-start-commit"
title = "Collapse the delivery path: work start commits its record and work pr opens the pull request"
scope = "Commit the work record from work start and work link (staging only the record, with --no-commit preserving the previous behaviour), add the optional SCM contract operation pull_request_create implemented by the GitHub adapter through gh pr create, and add work pr <id> which renders the body from the record, opens the pull request once under a journaled operation, links the URL and commits the record. Update delivery guidance to the two-command path."
requires_spec = true
spec_reason = "Changes the observable behaviour of work start and work link, adds an SCM contract operation and a new work command, all observable delivery outcomes."
acceptance = [
    "After work start <id>, git status --porcelain is empty and git log -1 is the start commit touching only the record.",
    "work pr <id> on a pushed branch creates exactly one PR, links it, commits the link; a second call is a no-op that prints the existing URL.",
    "work pr without an upstream refuses with a remedy and no side effects.",
    "Tests use a fake SCM provider and a real temporary git repository (see existing start tests); no test calls GitHub.",
]
reviewed = true
depends_on = []
requirements = [
    "TR-06",
]

