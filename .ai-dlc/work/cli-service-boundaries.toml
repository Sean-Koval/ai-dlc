title = "Move the context brief, readiness role derivation and tracker-plan validation out of the CLI"
scope = "Relocate three pieces of policy from src/ai_dlc/cli.py into their responsible services: the context brief into the work package, the explicit-provider-selection filter for readiness into setup/provision.py, and the tracker mapping-table validation into setup/tracker_targets.py. Expose the context brief through MCP. The CLI keeps only argument parsing and output; observable output of every command is unchanged."
