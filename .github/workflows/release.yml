name: Release verification
on:
  workflow_dispatch:
    inputs:
      artifact_base_url:
        description: "Intended HTTPS directory for exact candidate assets; does not publish"
        required: true
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/bootstrap.sh --source --target github-actions
      - run: ai-dlc project check --required --target github-actions
      - run: uv build
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file dist/requirements.txt
      - name: Verify wheel installation against published constraints
        run: |
          uv venv /tmp/ai-dlc-wheel
          uv pip install --python /tmp/ai-dlc-wheel/bin/python --require-hashes -r dist/requirements.txt
          uv pip install --python /tmp/ai-dlc-wheel/bin/python --no-deps dist/*.whl
          /tmp/ai-dlc-wheel/bin/ai-dlc --help
          mkdir /tmp/ai-dlc-scaffold
          cd /tmp/ai-dlc-scaffold
          /tmp/ai-dlc-wheel/bin/ai-dlc-cli scaffold --all
      - name: Prepare unpublished bootstrap manifest
        env:
          ARTIFACT_BASE_URL: ${{ inputs.artifact_base_url }}
        run: |
          ENGINE_VERSION=$(uv run --locked --no-sync python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          uv run --locked --no-sync python scripts/release_manifest.py --artifacts dist --base-url "$ARTIFACT_BASE_URL" --version "$ENGINE_VERSION" --output dist/release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
