name: Release
# Manual dispatch builds a candidate or verifies an existing published tag, without publication.
# A v<version> tag builds, verifies and publishes exactly the verified assets,
# then bootstraps a throwaway project from the published release.
on:
  workflow_dispatch:
    inputs:
      artifact_base_url:
        description: "Candidate HTTPS directory (ignored when verifying an existing tag)"
        required: true
        type: string
      verify_published_tag:
        description: "Existing tag to verify read-only; skips candidate build and publication"
        required: false
        default: ""
        type: string
  push:
    tags: ["v*"]
permissions:
  contents: read
jobs:
  package:
    if: github.event_name != 'workflow_dispatch' || inputs.verify_published_tag == ''
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The documentation gate compares against the recorded base commit.
          fetch-depth: 0
      - run: sh scripts/bootstrap.sh --source --target github-actions
      - name: Resolve the engine version and refuse a mismatched tag
        id: version
        run: |
          VERSION=$(uv run --locked --no-sync python -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.ref_type }}" = tag ] && [ "${{ github.ref_name }}" != "v$VERSION" ]; then
            echo "Tag ${{ github.ref_name }} does not match engine version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - run: ai-dlc project check --required --target github-actions
      - run: uv build
      - run: uv export --locked --no-dev --no-emit-project --format requirements-txt --output-file dist/requirements.txt
      - name: Verify wheel installation against published constraints
        run: |
          uv venv /tmp/ai-dlc-wheel
          uv pip install --python /tmp/ai-dlc-wheel/bin/python --require-hashes -r dist/requirements.txt
          uv pip install --python /tmp/ai-dlc-wheel/bin/python --no-deps dist/*.whl
          /tmp/ai-dlc-wheel/bin/ai-dlc --help
          mkdir /tmp/ai-dlc-scaffold
          cd /tmp/ai-dlc-scaffold
          /tmp/ai-dlc-wheel/bin/ai-dlc-cli scaffold --all
      - name: Prepare the hash-bound bootstrap manifest
        env:
          ARTIFACT_BASE_URL: ${{ github.event_name == 'push' && github.ref_type == 'tag' && format('https://github.com/{0}/releases/download/{1}', github.repository, github.ref_name) || inputs.artifact_base_url }}
        run: |
          rm -f dist/.gitignore
          uv run --locked --no-sync python scripts/prepare_release_assets.py --artifacts dist --base-url "$ARTIFACT_BASE_URL" --version "${{ steps.version.outputs.version }}"
          cat dist/release.sh dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-candidate
          path: dist/
          if-no-files-found: error

  verify-windows-candidate:
    needs: package
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: candidate
      - name: Consume exact candidate assets without publication
        shell: powershell
        run: python scripts/verify_windows_consumer.py --artifacts candidate --workspace "$env:RUNNER_TEMP/candidate journey é" --evidence "$env:RUNNER_TEMP/candidate-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-candidate-evidence
          path: ${{ runner.temp }}/candidate-evidence
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, verify-windows-candidate]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist
      - name: Publish exactly the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --title "AI-DLC ${{ github.ref_name }}" \
            --notes "Hash-bound bootstrap release. Install with the runbook in docs/runbooks/release-publication.md; verify assets against SHA256SUMS." \
            --verify-tag \
            dist/ai_dlc-${{ needs.package.outputs.version }}-py3-none-any.whl \
            dist/ai_dlc-${{ needs.package.outputs.version }}.tar.gz \
            dist/requirements.txt \
            dist/release.sh \
            dist/bootstrap.sh \
            dist/versions.sh \
            dist/download.sh \
            dist/bootstrap.ps1 \
            dist/windows.json \
            dist/windows.ps1 \
            dist/windows-native.cs \
            dist/windows-select.py \
            dist/SHA256SUMS

  verify-published:
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.verify_published_tag != '') ||
       (github.event_name == 'push' && github.ref_type == 'tag' &&
        needs.package.result == 'success' && needs.publish.result == 'success'))
    needs: [package, publish]
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_published_tag || github.ref_name }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Bootstrap from the published assets alone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p /tmp/seed/bootstrap /tmp/seed/scripts && cd /tmp/seed
          for f in bootstrap.sh versions.sh download.sh release.sh SHA256SUMS; do
            gh release download "$RELEASE_TAG" --repo "${{ github.repository }}" --pattern "$f" --dir .
          done
          grep -E ' (release|bootstrap|versions|download)\.sh$' SHA256SUMS | (command -v sha256sum >/dev/null && sha256sum -c - || shasum -a 256 -c -)
          mv bootstrap.sh scripts/ && mv versions.sh download.sh release.sh bootstrap/
          printf 'schema = 4\n' > ai-dlc.toml
          sh scripts/bootstrap.sh --target local --root /tmp/seed
      - name: Generate and check a python project with the released engine
        run: |
          set -eu
          ai-dlc --version
          ai-dlc project init /tmp/demo --preset python
          test -f /tmp/demo/bootstrap/release.sh
          cmp /tmp/demo/bootstrap/release.sh /tmp/seed/bootstrap/release.sh
          cd /tmp/demo
          sh scripts/bootstrap.sh --target local
          git init
          git config user.name "AI-DLC release verification"
          git config user.email "release-verification@example.invalid"
          git add .
          git commit -m "Initialize release verification fixture"
          ai-dlc project check --required --target github-actions

  verify-published-windows:
    if: >-
      !cancelled() &&
      ((github.event_name == 'workflow_dispatch' && inputs.verify_published_tag != '') ||
       (github.event_name == 'push' && github.ref_type == 'tag' &&
        needs.package.result == 'success' && needs.publish.result == 'success'))
    needs: [package, publish]
    runs-on: windows-2025
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_published_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download original release assets read-only
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$env:RELEASE_TAG" --repo "${{ github.repository }}" --dir published
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Replay original assets with identified verification controller
        shell: powershell
        run: python scripts/verify_windows_consumer.py --artifacts published --workspace "$env:RUNNER_TEMP/published journey é" --evidence "$env:RUNNER_TEMP/published-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-published-evidence
          path: ${{ runner.temp }}/published-evidence
          if-no-files-found: error
