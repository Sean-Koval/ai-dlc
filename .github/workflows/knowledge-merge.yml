# Reusable workflow for knowledge repositories, run on push to the default branch:
#   on:
#     push:
#       branches: [main]
#   jobs:
#     number:
#       uses: Sean-Koval/ai-dlc/.github/workflows/knowledge-merge.yml@main
#       with:
#         records: records
#         app-id: ${{ vars.KNOWLEDGE_APP_ID }}
#       secrets:
#         private-key: ${{ secrets.KNOWLEDGE_APP_PRIVATE_KEY }}
#
# It numbers slug-id records (DEC-0001 and so on), rewrites every link to them and
# regenerates the OKF index.md files, as one commit on the branch `knowledge-number`.
# It opens one pull request from that branch, or updates the open one. No workflow
# pushes to main. By default the pull request waits for a person to merge it, since
# spec section 10 allows no automatic merges for 1.0. `auto-merge: true` turns on
# squash auto-merge; that is an explicit exception the repository owner decides.
#
# Collision safety: only this workflow writes numbered ids, its runs share one
# concurrency group, and each run recomputes from the tip of main and force-pushes
# the one numbering branch. The open pull request therefore always numbers every
# slug record on main against the highest number on main. A record merged while the
# pull request waits keeps its slug until the next run, which starts when the
# numbering pull request merges.
#
# Credentials (KAN-522): give the GitHub App's `app-id` and `private-key`, and each
# run mints an installation token for this repository with
# actions/create-github-app-token. Installation tokens expire within an hour, so a
# stored one stops working; a caller can't mint one and pass it in either. A
# fine-grained personal token in `token` is the fallback. With no credential the job
# skips with a notice; with only one of app-id and private-key it fails. The App is
# the bypass actor for the numbering branch. A pull request opened with
# GITHUB_TOKEN starts no checks. See contracts/README.md for the repository settings.
name: Knowledge merge
on:
  workflow_call:
    inputs:
      records:
        description: Records directory, relative to the repository root.
        type: string
        default: "."
      branch:
        description: Branch to number; defaults to the repository's default branch.
        type: string
        default: ""
      numbering-branch:
        description: Branch the numbering pull request comes from.
        type: string
        default: knowledge-number
      ai-dlc-ref:
        description: ai-dlc git ref to install; pin a tag or commit for repeatable runs.
        type: string
        default: main
      auto-merge:
        description: Turn on squash auto-merge for the numbering pull request (an owner's exception).
        type: boolean
        default: false
      app-id:
        description: GitHub App ID; with the private-key secret, each run mints an installation token.
        type: string
        default: ""
    secrets:
      private-key:
        description: The GitHub App's private key (PEM), used with app-id.
        required: false
      token:
        description: Fallback without an App, such as a fine-grained personal token with contents and pull-requests write.
        required: false
permissions:
  contents: read
jobs:
  number:
    name: Number records and write indexes
    runs-on: ubuntu-24.04
    concurrency:
      group: knowledge-merge-${{ github.repository }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ inputs.branch || github.event.repository.default_branch }}
      NUMBERING: ${{ inputs.numbering-branch }}
    steps:
      - name: Choose credentials
        id: credentials
        env:
          APP_ID: ${{ inputs.app-id }}
          HAS_KEY: ${{ secrets.private-key != '' }}
          HAS_TOKEN: ${{ secrets.token != '' }}
        run: |
          if [ -n "$APP_ID" ] && [ "$HAS_KEY" = "true" ]; then
            echo "use=app" >> "$GITHUB_OUTPUT"
          elif [ -n "$APP_ID" ] || [ "$HAS_KEY" = "true" ]; then
            echo "::error title=Numbering credentials::Give both app-id and the private-key secret to mint a GitHub App token; only one is set."
            exit 1
          elif [ "$HAS_TOKEN" = "true" ]; then
            echo "use=token" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Numbering skipped::No app-id and private-key (or token) given, so records are not numbered."
            echo "use=none" >> "$GITHUB_OUTPUT"
          fi
      - name: Mint a GitHub App installation token
        id: app
        if: steps.credentials.outputs.use == 'app'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ inputs.app-id }}
          private-key: ${{ secrets.private-key }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # Only what numbering needs, whatever else the App's installation may grant.
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v4
        if: steps.credentials.outputs.use != 'none'
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ steps.app.outputs.token || secrets.token }}
      - uses: actions/setup-python@v5
        if: steps.credentials.outputs.use != 'none'
        with:
          python-version: '3.12'
      - name: Install ai-dlc
        if: steps.credentials.outputs.use != 'none'
        env:
          AI_DLC_REF: ${{ inputs.ai-dlc-ref }}
        run: python -m pip install "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
      - name: Number and index the tip of main
        if: steps.credentials.outputs.use != 'none'
        env:
          RECORDS: ${{ inputs.records }}
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          ai-dlc knowledge number "$RECORDS" > "$RUNNER_TEMP/number.json" \
            || { cat "$RUNNER_TEMP/number.json"; exit 1; }
          ai-dlc knowledge index "$RECORDS" > "$RUNNER_TEMP/index.json" \
            || { cat "$RUNNER_TEMP/index.json"; exit 1; }
          ai-dlc knowledge number "$RECORDS" --check > /dev/null
          ai-dlc knowledge index "$RECORDS" --check > /dev/null
      - name: Open or update the numbering pull request
        if: steps.credentials.outputs.use != 'none'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.token }}
          RECORDS: ${{ inputs.records }}
          AUTO_MERGE: ${{ inputs.auto-merge }}
        run: |
          open=$(gh pr list --head "$NUMBERING" --base "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          git add -A -- "$RECORDS"
          if git diff --cached --quiet; then
            echo "Nothing to number or index."
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch \
                --comment "Main is already numbered and indexed."
            fi
            exit 0
          fi
          git config user.name "knowledge-number[bot]"
          git config user.email "knowledge-number@users.noreply.github.com"
          git commit -q -m "chore(knowledge): number records and regenerate indexes"
          git push --force origin "HEAD:refs/heads/$NUMBERING"
          if [ -z "$open" ]; then
            gh pr create --base "$BRANCH" --head "$NUMBERING" \
              --title "chore(knowledge): number records and regenerate indexes" \
              --body "Generated by ai-dlc knowledge number and knowledge index from the tip of $BRANCH. Do not edit; the next run replaces this branch."
            open=$(gh pr list --head "$NUMBERING" --base "$BRANCH" --state open \
              --json number --jq '.[0].number')
          fi
          if [ "$AUTO_MERGE" = "true" ]; then
            gh pr merge "$open" --auto --squash
          else
            echo "Numbering pull request #$open waits for a person to merge it."
          fi
