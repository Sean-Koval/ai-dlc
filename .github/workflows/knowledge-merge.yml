# Reusable workflow for knowledge repositories, run on push to the default branch:
#   on:
#     push:
#       branches: [main]
#   jobs:
#     number:
#       uses: Sean-Koval/ai-dlc/.github/workflows/knowledge-merge.yml@main
#       with:
#         records: records
#       secrets:
#         token: ${{ secrets.KNOWLEDGE_BOT_TOKEN }}
#
# It numbers slug-id records (DEC-0001 and so on), rewrites every link to them and
# regenerates the OKF index.md files, as one commit on the branch `knowledge-number`.
# It opens one pull request from that branch, or updates the open one, and turns on
# auto-merge (squash), so the commit lands once the required checks, including
# `knowledge check`, pass. Main stays protected: no workflow pushes to it.
#
# Collision safety: only this workflow writes numbered ids, its runs share one
# concurrency group, and each run recomputes from the tip of main and force-pushes
# the one numbering branch. The open pull request therefore always numbers every
# slug record on main against the highest number on main. A record merged while the
# pull request waits keeps its slug until the next run, which starts when the
# numbering pull request merges.
#
# The token must be a GitHub App installation token or a fine-grained token with
# contents and pull-requests write. A pull request opened with GITHUB_TOKEN starts
# no checks, so its auto-merge would wait forever. The repository must allow
# auto-merge and squash merging (see contracts/README.md).
name: Knowledge merge
on:
  workflow_call:
    inputs:
      records:
        description: Records directory, relative to the repository root.
        type: string
        default: "."
      branch:
        description: Branch to number; defaults to the repository's default branch.
        type: string
        default: ""
      numbering-branch:
        description: Branch the numbering pull request comes from.
        type: string
        default: knowledge-number
      ai-dlc-ref:
        description: ai-dlc git ref to install; pin a tag or commit for repeatable runs.
        type: string
        default: main
    secrets:
      token:
        description: App or fine-grained token with contents and pull-requests write.
        required: true
permissions:
  contents: read
jobs:
  number:
    name: Number records and write indexes
    runs-on: ubuntu-24.04
    concurrency:
      group: knowledge-merge-${{ github.repository }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ inputs.branch || github.event.repository.default_branch }}
      NUMBERING: ${{ inputs.numbering-branch }}
      GH_TOKEN: ${{ secrets.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ai-dlc
        env:
          AI_DLC_REF: ${{ inputs.ai-dlc-ref }}
        run: python -m pip install "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
      - name: Number and index the tip of main
        env:
          RECORDS: ${{ inputs.records }}
        run: |
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          ai-dlc knowledge number "$RECORDS" > "$RUNNER_TEMP/number.json" \
            || { cat "$RUNNER_TEMP/number.json"; exit 1; }
          ai-dlc knowledge index "$RECORDS" > "$RUNNER_TEMP/index.json" \
            || { cat "$RUNNER_TEMP/index.json"; exit 1; }
          ai-dlc knowledge number "$RECORDS" --check > /dev/null
          ai-dlc knowledge index "$RECORDS" --check > /dev/null
      - name: Open or update the numbering pull request
        env:
          RECORDS: ${{ inputs.records }}
        run: |
          open=$(gh pr list --head "$NUMBERING" --base "$BRANCH" --state open \
            --json number --jq '.[0].number // empty')
          git add -A -- "$RECORDS"
          if git diff --cached --quiet; then
            echo "Nothing to number or index."
            if [ -n "$open" ]; then
              gh pr close "$open" --delete-branch \
                --comment "Main is already numbered and indexed."
            fi
            exit 0
          fi
          git config user.name "knowledge-number[bot]"
          git config user.email "knowledge-number@users.noreply.github.com"
          git commit -q -m "chore(knowledge): number records and regenerate indexes"
          git push --force origin "HEAD:refs/heads/$NUMBERING"
          if [ -z "$open" ]; then
            gh pr create --base "$BRANCH" --head "$NUMBERING" \
              --title "chore(knowledge): number records and regenerate indexes" \
              --body "Generated by ai-dlc knowledge number and knowledge index from the tip of $BRANCH. Do not edit; the next run replaces this branch."
            open=$(gh pr list --head "$NUMBERING" --base "$BRANCH" --state open \
              --json number --jq '.[0].number')
          fi
          gh pr merge "$open" --auto --squash
