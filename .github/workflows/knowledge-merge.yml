# Reusable workflow for knowledge repositories, run on push to the default branch:
#   on:
#     push:
#       branches: [main]
#   permissions:
#     contents: write
#   jobs:
#     number:
#       uses: Sean-Koval/ai-dlc/.github/workflows/knowledge-merge.yml@main
#       with:
#         records: records
#
# It numbers slug-id records (DEC-0001 and so on), rewrites every link to them,
# regenerates the OKF index.md files and pushes the result as one commit.
#
# Collision safety: the job runs in one concurrency group per repository with
# cancel-in-progress false, so numbering runs never overlap. A run always works on
# the branch tip, not the triggering commit, so a run GitHub drops while another
# waits loses nothing: the waiting run numbers every record merged so far. A merge
# that lands while a run works makes the push non-fast-forward; the run then
# resets to the new tip and numbers again, up to `attempts` times.
#
# A commit pushed with GITHUB_TOKEN starts no new workflow run. With another
# token, the next run finds nothing to number and makes no commit.
name: Knowledge merge
on:
  workflow_call:
    inputs:
      records:
        description: Records directory, relative to the repository root.
        type: string
        default: "."
      branch:
        description: Branch to number on; defaults to the repository's default branch.
        type: string
        default: ""
      ai-dlc-ref:
        description: ai-dlc git ref to install; pin a tag or commit for repeatable runs.
        type: string
        default: main
      attempts:
        description: Push attempts before giving up when other merges keep landing.
        type: number
        default: 5
    secrets:
      token:
        description: Token allowed to push to the branch (needed when it is protected).
        required: false
permissions:
  contents: write
jobs:
  number:
    name: Number records and write indexes
    runs-on: ubuntu-24.04
    concurrency:
      group: knowledge-merge-${{ github.repository }}
      cancel-in-progress: false
    env:
      BRANCH: ${{ inputs.branch || github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0
          token: ${{ secrets.token || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install ai-dlc
        env:
          AI_DLC_REF: ${{ inputs.ai-dlc-ref }}
        run: python -m pip install "ai-dlc @ git+https://github.com/Sean-Koval/ai-dlc@${AI_DLC_REF}"
      - name: Number, index and push
        env:
          RECORDS: ${{ inputs.records }}
          ATTEMPTS: ${{ inputs.attempts }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          attempt=1
          while :; do
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"
            ai-dlc knowledge number "$RECORDS" > number.json || { cat number.json; exit 1; }
            ai-dlc knowledge index "$RECORDS" > index.json || { cat index.json; exit 1; }
            rm -f number.json index.json
            git add -A -- "$RECORDS"
            if git diff --cached --quiet; then
              echo "Nothing to number or index."
              exit 0
            fi
            git commit -q -m "chore(knowledge): number records and regenerate indexes"
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            if [ "$attempt" -ge "$ATTEMPTS" ]; then
              echo "Gave up after $attempt attempts: $BRANCH kept moving." >&2
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep $((attempt * 3))
          done
      - name: Verify the pushed commit is numbered and indexed
        env:
          RECORDS: ${{ inputs.records }}
        run: |
          ai-dlc knowledge number "$RECORDS" --check
          ai-dlc knowledge index "$RECORDS" --check
