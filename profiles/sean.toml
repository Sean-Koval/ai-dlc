schema = 4

[modules]
include = ["core", "python", "node", "rust", "docker", "vscode", "codex", "claude-code", "openspec", "obsidian", "context7", "serena"]

[preferences]
headless = false

[roles]
specs = "openspec"
# Jira Cloud project KAN is the work tracker, decisions included
# (docs/decisions/0002-jira-work-tracker-and-trace-correlation.md); GitHub holds
# code, pull requests and CI as evidence. This profile still selects GitHub Issues:
# existing work records are bound to it, and the switch to jira-cloud waits for the
# live qualification in KAN-51 (KAN-286). Track new work in KAN.
# Keep repository and account mappings in each project's ai-dlc.toml.
tracker = "github-issues"
knowledge = "obsidian"
scm = "github"
deploy = "none"
agent-client = ["claude-code", "codex"]
