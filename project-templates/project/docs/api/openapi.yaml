openapi: 3.1.0
info:
  title: Project API
  version: 0.1.0
paths:
  /health:
    get:
      operationId: health
      summary: Report service health
      security: []
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
