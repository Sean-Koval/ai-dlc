schema = 4

[engine]
version = "0.4.0"

[project]
name = "AI-DLC"

[roles]
specs = "openspec"
tracker = "github-issues"
knowledge = "obsidian"
scm = "github"
deploy = "none"
agent-client = ["claude-code", "codex"]

[scm]
repository = "Sean-Koval/ai-dlc"
workflow = "verify.yml"
target_branch = "main"
receipt_artifacts = [
  "ai-dlc-receipt-ubuntu-24.04",
  "ai-dlc-receipt-ubuntu-24.04-arm",
  "ai-dlc-receipt-ubuntu-26.04",
  "ai-dlc-receipt-ubuntu-26.04-arm",
  "ai-dlc-receipt-macos-15-intel",
]

[providers.linear]
token_env = "LINEAR_SANDBOX_TOKEN"
team_id = "47b701a4-d6a6-4d27-85fc-6dd42030ddd3"
health_reference = "2a8b487f-3433-4ebe-a9e2-a16ac5b156da"

[providers.linear.statuses]
in_progress = "6076dc88-dd2f-4e2e-85aa-aed1a6d36bcf"
closed = "3e34f09e-e258-4044-b034-8d5dd4e63fb4"

[gates]
finish = ["specification-current", "pr-merged", "ci-green"]

[[setup.steps]]
id = "python-dependencies"
command = "uv sync --locked"
verify = "uv sync --locked --check"

[[setup.steps]]
id = "type-checker-runtime"
command = "uv run --locked --no-sync pyright --version"
verify = "uv run --locked --no-sync pyright --version"

[checks]
required = ["layout", "generated", "format", "lint", "types", "test", "documentation"]

[checks.commands]
layout = "uv run --locked --no-sync python scripts/check_layout.py"
generated = "ai-dlc agents render --check && uv run --locked --no-sync python scripts/check_generated.py"
format = "uv run --locked --no-sync ruff format --check src tests scripts"
lint = "uv run --locked --no-sync ruff check src tests scripts"
types = "uv run --locked --no-sync pyright --pythonpath .venv/bin/python"
test = "uv run --locked --no-sync pytest -q"
documentation = "ai-dlc project docs-gate"

[agents]
servers = []

[providers.github-issues]
host = "github.com"
kind = "github-issues"

repository = "Sean-Koval/ai-dlc"
viewer_id = "MDQ6VXNlcjQ4MDcxODcw"
[providers.github-issues.project]
id = "PVT_kwHOAt2Evs4BiwXI"
status_field_id = "PVTSSF_lAHOAt2Evs4BiwXIzhhnLb8"

[providers.github-issues.project.statuses]
closed = "98236657"
in_progress = "47fc9ee4"
open = "f75ad846"
