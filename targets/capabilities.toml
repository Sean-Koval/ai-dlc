# Execution targets accepted by `project setup --target` and `doctor --target`.
# Frozen (ADR 0001): ai-dlc sets up local checkouts and CI only. Cloud sandboxes are
# rendered by hangar at claim time, so devcontainer, codex-cloud and claude-cloud were
# removed; the dev container bootstraps with `local`. No target here is qualified.

[local]
filesystem = true
network = true
authentication = "native-or-environment"
persistence = "machine"
hooks = "client-hook-floor"
knowledge = "explicit-existing-vault"
verified = false

[github-actions]
filesystem = true
network = true
authentication = "declared-workflow-permissions"
persistence = "artifacts-and-cache"
hooks = "unavailable"
knowledge = "unavailable"
verified = false
