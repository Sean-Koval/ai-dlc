<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">AI-DLC — A consistent workflow. Your tools.</title>
  <desc id="desc">AI-DLC connects portable project setup with a development flow from discover and specify to build and verify.</desc>
