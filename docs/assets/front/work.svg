eyframes s7{0%,27.353%{opacity:0}27.354%,100%{opacity:1}}.s7{animation:s7 40.80s step-end infinite}@keyframes y8{0%,31.716%{transform:translateX(0)}36.127%,100%{transform:translateX(624.0px)}}.y8{animation:y8 40.80s steps(80,end) infinite}@keyframes s8{0%,31.716%{opacity:0}31.717%,100%{opacity:1}}.s8{animation:s8 40.80s step-end infinite}@keyframes s9{0%,37.598%{opacity:0}37.599%,100%{opacity:1}}.s9{animation:s9 40.80s step-end infinite}@keyframes y10{0%,41.961%{transform:translateX(0)}46.373%,100%{transform:translateX(670.8px)}}.y10{animation:y10 40.80s steps(86,end) infinite}@keyframes s10{0%,41.961%{opacity:0}41.962%,100%{opacity:1}}.s10{animation:s10 40.80s step-end infinite}@keyframes y11{0%,52.010%{transform:translateX(0)}56.348%,100%{transform:translateX(460.2px)}}.y11{animation:y11 40.80s steps(59,end) infinite}@keyframes s11{0%,52.010%{opacity:0}52.011%,100%{opacity:1}}.s11{animation:s11 40.80s step-end infinite}@keyframes s12{0%,57.819%{opacity:0}57.820%,100%{opacity:1}}.s12{animation:s12 40.80s step-end infinite}@keyframes y13{0%,62.182%{transform:translateX(0)}66.594%,100%{transform:translateX(702.0px)}}.y13{animation:y13 40.80s steps(90,end) infinite}@keyframes s13{0%,62.182%{opacity:0}62.183%,100%{opacity:1}}.s13{animation:s13 40.80s step-end infinite}@keyframes y14{0%,72.231%{transform:translateX(0)}74.826%,100%{transform:translateX(546.0px)}}.y14{animation:y14 40.80s steps(70,end) infinite}@keyframes s14{0%,72.231%{opacity:0}72.232%,100%{opacity:1}}.s14{animation:s14 40.80s step-end infinite}@keyframes y15{0%,74.826%{transform:translateX(0)}76.606%,100%{transform:translateX(374.4px)}}.y15{animation:y15 40.80s steps(48,end) infinite}@keyframes s15{0%,74.826%{opacity:0}74.827%,100%{opacity:1}}.s15{animation:s15 40.80s step-end infinite}@keyframes s16{0%,78.076%{opacity:0}78.077%,100%{opacity:1}}.s16{animation:s16 40.80s step-end infinite}@keyframes y17{0%,82.439%{transform:translateX(0)}83.684%,100%{transform:translateX(257.4px)}}.y17{animation:y17 40.80s steps(33,end) infinite}@keyframes s17{0%,82.439%{opacity:0}82.440%,100%{opacity:1}}.s17{animation:s17 40.80s step-end infinite}@keyframes y18{0%,83.684%{transform:translateX(0)}86.813%,100%{transform:translateX(647.4px)}}.y18{animation:y18 40.80s steps(83,end) infinite}@keyframes s18{0%,83.684%{opacity:0}83.685%,100%{opacity:1}}.s18{animation:s18 40.80s step-end infinite}@keyframes s19{0%,88.284%{opacity:0}88.285%,100%{opacity:1}}.s19{animation:s19 40.80s step-end infinite}@keyframes s20{0%,92.647%{opacity:0}92.648%,100%{opacity:1}}.s20{animation:s20 40.80s step-end infinite}</style><rect width="785" height="418" rx="4" fill="#0A0A0A"/><rect x=".5" y=".5" width="784" height="417" rx="4" fill="none" stroke="#E6E7E3" stroke-opacity=".08"/><path d="M0 34.5H785" stroke="#E6E7E3" stroke-opacity=".09"/><g stroke="#8E9297" fill="none" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter" transform="translate(14,10.0) scale(.7)"><rect x="2.5" y="3.5" width="15" height="13"/><path d="M6 8l2.5 2L6 12M10.5 12.5H14"/></g><text class="b b1" x="42" y="20.75">AI-DLC</text><text class="b" x="99" y="20.75">WORK: NEW → START → PR → FINISH</text><text class="b" x="334" y="20.75">GITHUB STOOD IN LOCALLY</text><g class="s0"><text class="t" x="18" y="64.8" textLength="514.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc work new fix-receipts --title &quot;Retry receipt downloads&quot; \</tspan></text><rect class="y0" x="33.6" y="51.1" width="503.2" height="17.0" fill="#0A0A0A"/></g><g class="s1"><text class="t" x="18" y="81.8" textLength="530.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">> </tspan><tspan class="c">  --scope &quot;Retry one failed receipt download&quot; --no-requires-spec \</tspan></text><rect class="y1" x="33.6" y="68.2" width="518.8" height="17.0" fill="#0A0A0A"/></g><g class="s2"><text class="t" x="18" y="98.8" textLength="405.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">> </tspan><tspan class="c">  --spec-reason &quot;Bug fix with a regression test&quot; \</tspan></text><rect class="y2" x="33.6" y="85.2" width="394.0" height="17.0" fill="#0A0A0A"/></g><g class="s3"><text class="t" x="18" y="115.8" textLength="663.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">> </tspan><tspan class="c">  --acceptance &quot;A transient download failure retries once&quot; | jq -c &#x27;{id, reviewed}&#x27;</tspan></text><rect class="y3" x="33.6" y="102.2" width="651.4" height="17.0" fill="#0A0A0A"/></g><g class="s4"><text class="t" x="18" y="132.8">{&quot;id&quot;:&quot;fix-receipts&quot;,&quot;reviewed&quot;:false}</text></g><g class="s5"><text class="t" x="18" y="149.8" textLength="702.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">sed -i &#x27;s/^reviewed = false/reviewed = true/&#x27; .ai-dlc/work/fix-receipts.toml  # reviewed</tspan></text><rect class="y5" x="33.6" y="136.2" width="690.4" height="17.0" fill="#0A0A0A"/></g><g class="s6"><text class="t" x="18" y="166.8" textLength="577.2" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc work publish fix-receipts | jq -c &#x27;{status, issue: .tracker.url}&#x27;</tspan></text><rect class="y6" x="33.6" y="153.2" width="565.6" height="17.0" fill="#0A0A0A"/></g><g class="s7"><text class="t" x="18" y="183.8">{&quot;status&quot;:&quot;published&quot;,&quot;issue&quot;:&quot;https://github.com/example/app/issues/42&quot;}</text></g><g class="s8"><text class="t" x="18" y="200.8" textLength="639.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc work start fix-receipts | jq -c &#x27;{status, branch, issue: .tracker.state}&#x27;</tspan></text><rect class="y8" x="33.6" y="187.2" width="628.0" height="17.0" fill="#0A0A0A"/></g><g class="s9"><text class="t" x="18" y="217.8">{&quot;status&quot;:&quot;started&quot;,&quot;branch&quot;:&quot;work/fix-receipts&quot;,&quot;issue&quot;:&quot;in_progress&quot;}</text></g><g class="s10"><text class="t" x="18" y="234.8" textLength="686.4" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">echo &#x27;RETRIES = 1&#x27; &gt; src/receipts.py &amp;&amp; git commit -qam &#x27;fix: retry receipt downloads&#x27;</tspan></text><rect class="y10" x="33.6" y="221.2" width="674.8" height="17.0" fill="#0A0A0A"/></g><g class="s11"><text class="t" x="18" y="251.8" textLength="475.8" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc work pr fix-receipts | jq -c &#x27;{status, pr: .pr.url}&#x27;</tspan></text><rect class="y11" x="33.6" y="238.2" width="464.2" height="17.0" fill="#0A0A0A"/></g><g class="s12"><text class="t" x="18" y="268.8">{&quot;status&quot;:&quot;created&quot;,&quot;pr&quot;:&quot;https://github.com/example/app/pull/43&quot;}</text></g><g class="s13"><text class="t" x="18" y="285.8" textLength="717.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">git checkout -q main &amp;&amp; git merge -q --no-ff work/fix-receipts -m &#x27;Merge #43&#x27;  # PR merged</tspan></text><rect class="y13" x="33.6" y="272.1" width="706.0" height="17.0" fill="#0A0A0A"/></g><g class="s14"><text class="t" x="18" y="302.8" textLength="561.6" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc project check --required --receipt .ai-dlc/local/receipt.json \</tspan></text><rect class="y14" x="33.6" y="289.1" width="550.0" height="17.0" fill="#0A0A0A"/></g><g class="s15"><text class="t" x="18" y="319.8" textLength="390.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">> </tspan><tspan class="c">  | jq -c &#x27;[.outcomes[] | &quot;\(.id): \(.status)&quot;]&#x27;</tspan></text><rect class="y15" x="33.6" y="306.1" width="378.4" height="17.0" fill="#0A0A0A"/></g><g class="s16"><text class="t" x="18" y="336.8">[&quot;generated: passed&quot;,&quot;work-records: passed&quot;]</text></g><g class="s17"><text class="t" x="18" y="353.8" textLength="273.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">$ </tspan><tspan class="c">ai-dlc work finish fix-receipts \</tspan></text><rect class="y17" x="33.6" y="340.1" width="261.4" height="17.0" fill="#0A0A0A"/></g><g class="s18"><text class="t" x="18" y="370.8" textLength="663.0" lengthAdjust="spacingAndGlyphs"><tspan class="p">> </tspan><tspan class="c">  | jq -c &#x27;{status, issue: .tracker.state, gates: (.evidence | keys | join(&quot;, &quot;))}&#x27;</tspan></text><rect class="y18" x="33.6" y="357.1" width="651.4" height="17.0" fill="#0A0A0A"/></g><g class="s19"><text class="t" x="18" y="387.8">{&quot;status&quot;:&quot;completed&quot;,&quot;issue&quot;:&quot;closed&quot;,&quot;gates&quot;:&quot;ci-green, pr-merged, specification-current&quot;}</text></g><g class="s20"><text class="t" x="18" y="404.8"><tspan class="p">$ ▌</tspan></text></g></svg>
