<svg class="ad" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-label="Where ai-dlc sits: it prepares developer machines and gates work on merged evidence; it publishes the workflow plugin that a team harness pins, hangar runs and flightdeck compares"><style>.ad .n{font:700 17px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:#0A0A0A}.ad .s{font:700 13px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:#0A0A0A}.ad .b{font:400 12.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:#474746}.ad .e{font:400 12.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:#666664}.ad .l{font:500 10.5px 'DM Mono',ui-monospace,Menlo,monospace;letter-spacing:.08em;fill:#666664}.ad .edge{fill:none;stroke:#666664;stroke-width:1.25}.ad .plan{fill:none;stroke:#666664;stroke-width:1.25;stroke-dasharray:5 4}</style><defs><marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#666664"/></marker></defs><rect width="1200" height="620" fill="#F4F4F2"/><text class="l" x="40" y="44">WHERE AI-DLC SITS · THE DEVELOPER SIDE OF THE AGENT FACTORY</text><rect x="30" y="80" width="380" height="400" rx="3" fill="#FFFFFF" stroke="#7A5F00" stroke-width="1.5"/><rect x="30" y="80" width="380" height="2" fill="#1D7D3E"/><text class="l" x="48" y="106">DEVELOPER MACHINE · LOCAL</text><text class="n" x="48" y="130">ai-dlc</text><rect x="60" y="140" width="320" height="52" rx="3" fill="#EDEDEB" stroke="#858583"/><text class="s" x="74" y="161">machine enroll</text><text class="b" x="74" y="180">a pinned profile: tools, clients, credentials</text><rect x="60" y="218" width="320" height="52" rx="3" fill="#EDEDEB" stroke="#858583"/><text class="s" x="74" y="239">work new → start</text><text class="b" x="74" y="258">reviewed record, tracker issue, branch</text><path class="edge" d="M220 192 V216" marker-end="url(#ad-arrow)"/><rect x="60" y="296" width="320" height="52" rx="3" fill="#EDEDEB" stroke="#858583"/><text class="s" x="74" y="317">work pr → project check</text><text class="b" x="74" y="336">one PR; checks write a receipt</text><path class="edge" d="M220 270 V294" marker-end="url(#ad-arrow)"/><rect x="60" y="374" width="320" height="52" rx="3" fill="#EDEDEB" stroke="#858583"/><text class="s" x="74" y="395">work finish</text><text class="b" x="74" y="414">merged PR + CI receipt, then close</text><path class="edge" d="M220 348 V372" marker-end="url(#ad-arrow)"/><rect x="500" y="80" width="300" height="170" rx="3" fill="#FFFFFF" stroke="#BDBDBA"/><text class="l" x="518" y="106">TEAM HARNESS REPO</text><text class="n" x="518" y="130">harness.lock</text><text class="b" x="518" y="154">pins the ai-dlc workflow plugin</text><text class="b" x="518" y="173">(skills, guide, safe hooks)</text><text class="b" x="518" y="192">off in stable, on in candidate</text><rect x="890" y="80" width="280" height="170" rx="3" fill="#FFFFFF" stroke="#BDBDBA"/><rect x="890" y="80" width="280" height="2" fill="#A44C1D"/><text class="l" x="908" y="106">RUN</text><text class="n" x="908" y="130">hangar</text><text class="b" x="908" y="154">runs coding agents in sandboxes</text><text class="b" x="908" y="173">renders the harness at claim</text><text class="b" x="908" y="192">time; owns verify and landing</text><rect x="890" y="310" width="280" height="170" rx="3" fill="#FFFFFF" stroke="#BDBDBA"/><rect x="890" y="310" width="280" height="2" fill="#914A8C"/><text class="l" x="908" y="336">JUDGE</text><text class="n" x="908" y="360">flightdeck</text><text class="b" x="908" y="384">A/B: with and without the</text><text class="b" x="908" y="403">plugin, same tasks; a verdict</text><text class="b" x="908" y="422">on the pull request</text><rect x="500" y="310" width="300" height="170" rx="3" fill="#FFFFFF" stroke="#BDBDBA"/><text class="l" x="518" y="336">SOURCE OF TRUTH</text><text class="n" x="518" y="360">GitHub</text><text class="b" x="518" y="384">issues, pull requests,</text><text class="b" x="518" y="403">CI receipts per merge commit</text><text class="b" x="518" y="422">decisions in docs/decisions/</text><path class="edge" d="M410 180 H496" marker-end="url(#ad-arrow)"/><text class="e" x="453" y="160" text-anchor="middle">publish</text><text class="e" x="453" y="176" text-anchor="middle">plugin</text><path class="edge" d="M800 165 H886" marker-end="url(#ad-arrow)"/><text class="e" x="843" y="145" text-anchor="middle">pinned</text><text class="e" x="843" y="161" text-anchor="middle">plugin</text><path class="edge" d="M1030 250 V306" marker-end="url(#ad-arrow)"/><text class="e" x="1040" y="276" text-anchor="start">trials,</text><text class="e" x="1040" y="292" text-anchor="start">traces</text><path class="edge" d="M410 400 H496" marker-end="url(#ad-arrow)"/><text class="e" x="453" y="380" text-anchor="middle">issue, PR,</text><text class="e" x="453" y="396" text-anchor="middle">receipt</text><path class="edge" d="M800 395 H886" marker-end="url(#ad-arrow)"/><text class="e" x="843" y="385" text-anchor="middle">report</text><rect x="30" y="520" width="1140" height="70" rx="3" fill="#FFFFFF" stroke="#858583" stroke-dasharray="4 4" fill-opacity="0"/><rect x="30" y="520" width="1140" height="2" fill="#816600"/><text class="l" x="48" y="546">GOVERN · PLANNED</text><text class="n" x="48" y="570">Tower: policy decisions, approvals, receipts</text></svg>
