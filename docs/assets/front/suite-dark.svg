<svg class="ad" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Where ai-dlc sits: it prepares developer machines and gates work on merged evidence; it publishes the workflow plugin that a team harness pins, hangar runs and flightdeck compares; Tower governs risky actions"><style>.ad .n{font:700 20px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:#FFFFFF}.ad .s{font:700 15px Archivo,'Helvetica Neue',Arial,sans-serif;font-stretch:125%;fill:#FFFFFF}.ad .b{font:400 15.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:#A6A6A6}.ad .e{font:400 13.5px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:#8A8A8A}.ad .l{font:500 14px 'Red Hat Text','Helvetica Neue',Arial,sans-serif;fill:#8A8A8A}.ad .edge{fill:none;stroke:#8A8A8A;stroke-width:1.25}</style><defs><marker id="ad-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8A8A8A"/></marker></defs><rect width="800" height="520" fill="#000000"/><text class="l" x="24" y="34">Where ai-dlc sits: the developer side of the agent factory</text><rect x="24" y="56" width="248" height="390" rx="12" fill="#141414" stroke="#6B6B6B"/><rect x="36" y="56" width="224" height="2" fill="#69C27E"/><text class="l" x="40" y="84">Developer machine, local</text><text class="n" x="40" y="112">ai-dlc</text><rect x="40" y="128" width="216" height="58" rx="8" fill="#0A0A0A" stroke="#6B6B6B"/><text class="s" x="54" y="152">machine enroll</text><text class="b" x="54" y="174">a pinned profile</text><rect x="40" y="206" width="216" height="58" rx="8" fill="#0A0A0A" stroke="#6B6B6B"/><text class="s" x="54" y="230">work new → start</text><text class="b" x="54" y="252">record, issue, branch</text><path class="edge" d="M148 186 V203" marker-end="url(#ad-arrow)"/><rect x="40" y="284" width="216" height="58" rx="8" fill="#0A0A0A" stroke="#6B6B6B"/><text class="s" x="54" y="308">work pr → project check</text><text class="b" x="54" y="330">a PR and a check receipt</text><path class="edge" d="M148 264 V281" marker-end="url(#ad-arrow)"/><rect x="40" y="362" width="216" height="58" rx="8" fill="#0A0A0A" stroke="#6B6B6B"/><text class="s" x="54" y="386">work finish</text><text class="b" x="54" y="408">merged, CI green, closed</text><path class="edge" d="M148 342 V359" marker-end="url(#ad-arrow)"/><rect x="336" y="56" width="196" height="170" rx="12" fill="#141414" stroke="#424242"/><text class="l" x="352" y="84">Team harness repository</text><text class="n" x="352" y="112">harness.lock</text><text class="b" x="352" y="140">pins the workflow</text><text class="b" x="352" y="162">plugin (skills, guide,</text><text class="b" x="352" y="184">hooks): off in stable,</text><text class="b" x="352" y="206">on in candidate</text><rect x="336" y="276" width="196" height="170" rx="12" fill="#141414" stroke="#424242"/><text class="l" x="352" y="304">Source of truth</text><text class="n" x="352" y="332">GitHub</text><text class="b" x="352" y="360">issues, pull requests,</text><text class="b" x="352" y="382">a CI receipt per merge</text><text class="b" x="352" y="404">commit, decisions in</text><text class="b" x="352" y="426">docs/decisions/</text><rect x="596" y="56" width="180" height="170" rx="12" fill="#141414" stroke="#424242"/><rect x="608" y="56" width="156" height="2" fill="#EE8F63"/><text class="l" x="612" y="84">Run</text><text class="n" x="612" y="112">hangar</text><text class="b" x="612" y="140">runs coding agents</text><text class="b" x="612" y="162">in sandboxes with</text><text class="b" x="612" y="184">the pinned harness</text><rect x="596" y="276" width="180" height="170" rx="12" fill="#141414" stroke="#424242"/><rect x="608" y="276" width="156" height="2" fill="#D98CD2"/><text class="l" x="612" y="304">Judge</text><text class="n" x="612" y="332">flightdeck</text><text class="b" x="612" y="360">compares runs with</text><text class="b" x="612" y="382">and without the</text><text class="b" x="612" y="404">plugin; posts the</text><text class="b" x="612" y="426">verdict on the PR</text><path class="edge" d="M272 132 H332" marker-end="url(#ad-arrow)"/><text class="e" x="302" y="112" text-anchor="middle">publish</text><text class="e" x="302" y="129" text-anchor="middle">plugin</text><path class="edge" d="M532 132 H592" marker-end="url(#ad-arrow)"/><text class="e" x="562" y="112" text-anchor="middle">pinned</text><text class="e" x="562" y="129" text-anchor="middle">plugin</text><path class="edge" d="M686 226 V272" marker-end="url(#ad-arrow)"/><text class="e" x="696" y="245" text-anchor="start">trials,</text><text class="e" x="696" y="262" text-anchor="start">traces</text><path class="edge" d="M272 372 H332" marker-end="url(#ad-arrow)"/><text class="e" x="302" y="336" text-anchor="middle">issue,</text><text class="e" x="302" y="353" text-anchor="middle">PR,</text><text class="e" x="302" y="370" text-anchor="middle">receipt</text><path class="edge" d="M596 372 H536" marker-end="url(#ad-arrow)"/><text class="e" x="566" y="352" text-anchor="middle">verdict</text><text class="e" x="566" y="369" text-anchor="middle">on PR</text><text class="l" x="24" y="488">Govern: Tower clears risky agent actions with policy decisions, approvals and signed receipts</text></svg>
