<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>River bicycle repairs</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183b36;font:17px system-ui,sans-serif}main{max-width:650px;margin:42px auto;padding:28px}h1{font-size:36px;line-height:1.12}h2{font-size:23px}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;padding:12px;border:1px solid #607a70;border-radius:8px}input,select,textarea{width:100%;background:white}button{background:#164d42;color:white;margin-top:20px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a64a00;outline-offset:3px}.card{background:white;border:1px solid #c8d1ca;border-radius:16px;padding:22px;margin-top:20px}small{color:#415c55}.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase}p{line-height:1.5}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}[hidden]{display:none!important}@media(max-width:500px){main{margin:0;padding:24px}h1{font-size:31px}}</style><main><p class="tag">Care for your everyday ride</p><h1>Book a repair</h1><p>Choose the workshop and morning that work for you.</p><label for="workshop">Workshop</label><select id="workshop"><option>River Workshop</option><option>River Workshop Annex</option></select><label for="slot">Appointment</label><select id="slot"><option>2030-04-03 09:00</option><option>2030-04-04 09:00</option></select><button id="review">Review appointment</button><section class="card" id="reviewPanel" hidden><h2>Your appointment</h2><p id="reviewText"></p><button id="confirm">Confirm appointment</button></section><section class="card" id="savedPanel" hidden><h2>Appointment confirmed</h2><p id="saved"></p></section></main><script>const workshop=document.querySelector('#workshop'),slot=document.querySelector('#slot');function display(){const x=JSON.parse(localStorage.getItem('bike-appointment')||'null');if(x){document.querySelector('#savedPanel').hidden=false;document.querySelector('#saved').textContent=x.workshop+' · '+x.slot;}}document.querySelector('#review').onclick=()=>{document.querySelector('#reviewPanel').hidden=false;document.querySelector('#reviewText').textContent=workshop.value+' · '+slot.value;};document.querySelector('#confirm').onclick=()=>{localStorage.setItem('bike-appointment',JSON.stringify({workshop:workshop.value,slot:slot.options[0].value}));display();};display();</script></html>
