<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Collection day</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183b36;font:17px system-ui,sans-serif}main{max-width:650px;margin:42px auto;padding:28px}h1{font-size:36px;line-height:1.12}h2{font-size:23px}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;padding:12px;border:1px solid #607a70;border-radius:8px}input,select,textarea{width:100%;background:white}button{background:#164d42;color:white;margin-top:20px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a64a00;outline-offset:3px}.card{background:white;border:1px solid #c8d1ca;border-radius:16px;padding:22px;margin-top:20px}small{color:#415c55}.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase}p{line-height:1.5}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}[hidden]{display:none!important}@media(max-width:500px){main{margin:0;padding:24px}h1{font-size:31px}}</style><main><link rel="stylesheet" href="council.css"><header class="council-header">Orchard Borough</header><h1>Your collection day</h1><p>Select your full address, including apartment number.</p><label for="address">Address</label><select id="address"><option value="1">8 Orchard Lane, Apartment 1</option><option value="11">8 Orchard Lane, Apartment 11</option></select><button id="review">Review address</button><section class="card" id="result" hidden><h2>Collection details</h2><p id="identity"></p><p id="day"></p><button id="save">Save this address</button><p id="saved" aria-live="polite"></p></section></main><script>const address=document.querySelector('#address');function show(){const id=address.value;document.querySelector('#result').hidden=false;document.querySelector('#identity').textContent=address.options[address.selectedIndex].textContent;document.querySelector('#day').textContent=id==='11'?'Thursday':'Tuesday';}document.querySelector('#review').onclick=show;document.querySelector('#save').onclick=()=>{localStorage.setItem('collection-address',address.value);document.querySelector('#saved').textContent='Address saved';};const saved=localStorage.getItem('collection-address');if(saved){address.value=saved;show();}</script></html>
