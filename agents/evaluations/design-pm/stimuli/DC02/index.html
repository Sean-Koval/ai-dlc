<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Repair queue</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183b36;font:17px system-ui,sans-serif}main{max-width:650px;margin:42px auto;padding:28px}h1{font-size:36px;line-height:1.12}h2{font-size:23px}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;padding:12px;border:1px solid #607a70;border-radius:8px}input,select,textarea{width:100%;background:white}button{background:#164d42;color:white;margin-top:20px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a64a00;outline-offset:3px}.card{background:white;border:1px solid #c8d1ca;border-radius:16px;padding:22px;margin-top:20px}small{color:#415c55}.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase}p{line-height:1.5}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}[hidden]{display:none!important}@media(max-width:500px){main{margin:0;padding:24px}h1{font-size:31px}}body{background:#fff;color:#222}button{background:#222;border-radius:0}.card{border-radius:0;border:2px solid #222;overflow-wrap:anywhere}textarea{color:#222;border-color:#222;border-radius:0}</style><main><h1>Repair queue</h1><p>Check an item in. Keep its queue number for collection.</p><label for="description">Item description</label><textarea id="description" rows="3">Blue folding chair with loose rear hinge and missing foot cap</textarea><button id="checkin">Confirm check-in</button><section id="items" aria-live="polite"></section></main><script>const key='repair-queue';function draw(){const items=JSON.parse(localStorage.getItem(key)||'[]');document.querySelector('#items').replaceChildren(...items.map(item=>{const node=document.createElement('section');node.className='card';const title=document.createElement('h2');title.textContent=item.number+' · Waiting for repair';const desc=document.createElement('p');desc.textContent=item.description;node.append(title,desc);return node;}));}document.querySelector('#checkin').onclick=()=>{const description=document.querySelector('#description').value.trim();if(!description)return;const items=JSON.parse(localStorage.getItem(key)||'[]');if(!items.some(x=>x.description===description)){items.push({description,number:'Q'+String(41+items.length).padStart(3,'0')});localStorage.setItem(key,JSON.stringify(items));}draw();};draw();</script></html>
