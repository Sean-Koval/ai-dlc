<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parcel pickup</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183b36;font:17px system-ui,sans-serif}main{max-width:650px;margin:42px auto;padding:28px}h1{font-size:36px;line-height:1.12}h2{font-size:23px}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;padding:12px;border:1px solid #607a70;border-radius:8px}input,select,textarea{width:100%;background:white}button{background:#164d42;color:white;margin-top:20px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a64a00;outline-offset:3px}.card{background:white;border:1px solid #c8d1ca;border-radius:16px;padding:22px;margin-top:20px}small{color:#415c55}.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase}p{line-height:1.5}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}[hidden]{display:none!important}@media(max-width:500px){main{margin:0;padding:24px}h1{font-size:31px}}dialog{max-width:340px;padding:24px;border:1px solid #607a70;border-radius:12px}dialog::backdrop{background:#0007}</style><main><h1>Collect your parcel</h1><label for="point">Collection point</label><select id="point"><option>Station counter</option><option>Station counter overflow</option></select><button id="open">Show pickup code</button><dialog id="pickup"><h2>Ready for pickup</h2><p id="location"></p><p>Pickup code: <strong id="code">P014</strong></p><input aria-label="Collection note" placeholder="Optional note"><div id="dismiss" role="button" tabindex="-1" style="padding:12px;background:#164d42;color:white;margin-top:20px;cursor:pointer">Close pickup code</div></dialog></main><script>const pickup=document.querySelector('#pickup');document.querySelector('#open').onclick=()=>{document.querySelector('#location').textContent=document.querySelector('#point').value;document.querySelector('#code').textContent=document.querySelector('#point').selectedIndex===1?'P015':'P014';pickup.showModal();};document.querySelector('#dismiss').onclick=()=>pickup.close();pickup.addEventListener('cancel',e=>e.preventDefault());</script></html>
