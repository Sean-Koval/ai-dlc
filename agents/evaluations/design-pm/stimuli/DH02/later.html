<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Garden schedule</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f4ee;color:#183b36;font:17px system-ui,sans-serif}main{max-width:650px;margin:42px auto;padding:28px}h1{font-size:36px;line-height:1.12}h2{font-size:23px}label{display:block;font-weight:650;margin:18px 0 6px}input,select,textarea,button{font:inherit;max-width:100%;padding:12px;border:1px solid #607a70;border-radius:8px}input,select,textarea{width:100%;background:white}button{background:#164d42;color:white;margin-top:20px;cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #a64a00;outline-offset:3px}.card{background:white;border:1px solid #c8d1ca;border-radius:16px;padding:22px;margin-top:20px}small{color:#415c55}.tag{font-size:13px;letter-spacing:.1em;text-transform:uppercase}p{line-height:1.5}.row{display:flex;gap:15px;align-items:center}.row>*{flex:1}[hidden]{display:none!important}@media(max-width:500px){main{margin:0;padding:24px}h1{font-size:31px}}main{max-width:700px}.card{padding:28px}h1{letter-spacing:-.025em}</style><main><h1>Watering schedule</h1><p>Choose a zone and save its start time and duration.</p><label for="zone">Zone</label><select id="zone"><option value="0">North beds</option><option value="1">North border</option></select><label for="start">Start time</label><input id="start" type="time"><label for="duration">Duration (minutes)</label><input id="duration" type="number" min="1" max="90"><button id="save">Save schedule</button><section class="card" id="summary" aria-live="polite"></section></main><script>const key='garden-schedule';let zones=JSON.parse(localStorage.getItem(key)||'[ {"name":"North beds","start":"06:10","duration":12},{"name":"North border","start":"06:40","duration":21}]');const select=document.querySelector('#zone');function draw(){document.querySelector('#start').value=zones[select.value].start;document.querySelector('#duration').value=zones[select.value].duration;document.querySelector('#summary').replaceChildren(...zones.map(x=>{const p=document.createElement('p');p.textContent=x.name+' · '+x.start+' · '+x.duration+' minutes';return p;}));}select.onchange=draw;document.querySelector('#save').onclick=()=>{const i=Number(select.value);zones[i].start=document.querySelector('#start').value;zones[i].duration=Number(document.querySelector('#duration').value);zones[1-i].duration=12;localStorage.setItem(key,JSON.stringify(zones));draw();};draw();</script></html>
