site_name: AI-DLC
site_description: One pinned machine profile, one workflow for people and agents, and a finish that needs merged evidence.
site_url: https://sean-koval.github.io/ai-dlc/
repo_url: https://github.com/Sean-Koval/ai-dlc
repo_name: Sean-Koval/ai-dlc
edit_uri: edit/main/docs/

theme:
  name: material
  font: false
  logo: assets/brand/mark.svg
  favicon: assets/brand/favicon.svg
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - search.suggest
    - content.code.copy
    - toc.follow
  palette:
    - scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light
    - scheme: default
      toggle:
        icon: material/weather-night
        name: Dark

extra_css:
  - stylesheets/airframe.css
  - stylesheets/airframe-docs.css
  - stylesheets/product.css

extra:
  social:
    - icon: material/factory
      link: https://sean-koval.github.io/agent-factory/
      name: Part of the agent factory

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.snippets

# docs/archive/ is historical material, not current guidance. Verification
# subdirectories hold raw evidence (JSON receipts, evaluation transcripts) that
# the verification records link to; they stay in the repository, not the site.
exclude_docs: |
  archive/
  verification/*/
  catalog.toml

# Curated from the documentation map (docs/design/documentation-map.md). Documents stay where
# docs/catalog.toml records them. Verification records under docs/verification/ are built but
# not listed here; release-verification.md links them from one table.
nav:
  - Home: index.md
  - Get started:
      - Get started: workflows/get-started.md
      - Work-computer setup: workflows/work-computer-setup.md
      - Machine enrollment: runbooks/machine-enrollment.md
      - GitHub ticket setup: github-ticket-setup.md
      - Jira Cloud setup: runbooks/jira-cloud-setup.md
  - Workflow plugin:
      - Overview: workflows/workflow-plugin.md
      - Pin it in a team harness: workflows/workflow-plugin-harness.md
  - Guides:
      - Development workflow: development-workflow.md
      - Workflow tool map: workflows/tool-map.md
  - Reference:
      - Architecture: architecture.md
      - Migration: migration.md
      - Changelog: https://github.com/Sean-Koval/ai-dlc/blob/main/CHANGELOG.md
      - Release verification: release-verification.md
      - Release publication: runbooks/release-publication.md
      - Documentation map: design/documentation-map.md
  - Design:
      - "ADR 0001: Refocus AI-DLC": decisions/0001-refocus-ai-dlc.md
      - Product direction: product-direction.md
      - Roadmap: roadmap.md
      - Local and shared knowledge: design/local-and-shared-knowledge.md
      - Native tool composition: design/native-tool-composition.md
      - Provider connections: design/provider-connections.md
      - Jira Cloud: design/jira-cloud.md
      - Framework delivery (September 2026 plan): design/framework-delivery.md
      - Provider toolsets PRD (historical): design/provider-toolsets-prd.md
      - "Review: portable profile enrollment": reviews/2026-09-03-portable-profile-enrollment.md
  - Frozen (bug fixes only):
      - Greenfield workflow: workflows/greenfield.md
      - Brownfield workflow: workflows/brownfield.md
      - Design to implementation: workflows/design-to-implementation.md
      - Design PM: design/design-pm.md
      - FDE documents: runbooks/fde-documents.md
      - Plane new work: design/plane-new-work.md
      - Plane setup: runbooks/plane-setup.md
      - Project documentation: design/project-documentation.md
      - Document workspace qualification: runbooks/document-workspace-qualification.md
