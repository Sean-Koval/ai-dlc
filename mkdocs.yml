          - Delivery path baseline: verification/delivery-path-baseline.md
          - End-to-end evaluation: verification/end-to-end-evaluation.md
          - Release candidate preparation: verification/release-candidate-preparation.md
          - Onboarding readiness: verification/onboarding-readiness.md
          - Setup continuity: verification/setup-continuity.md
          - Native setup recovery: verification/native-setup-recovery.md
          - Credential readiness: verification/credential-readiness.md
          - Bootstrap executable publication: verification/bootstrap-executable-publication.md
          - Offline conformance packaging: verification/offline-conformance-packaging.md
          - Backend contracts: verification/backend-contracts.md
          - Provider connections: verification/provider-connections.md
          - Provider mutation protocol: verification/provider-mutation-protocol.md
          - GitHub ticket workflows: verification/github-ticket-workflows.md
          - Jira Cloud new work: verification/jira-cloud-new-work.md
          - Plane new work: verification/plane-new-work.md
          - Selective tracker migration: verification/selective-tracker-migration.md
          - Native work harnesses: verification/native-work-harnesses.md
          - Native tool composition: verification/native-tool-composition.md
          - Toolset composition: verification/toolset-composition.md
          - Work-computer toolsets: verification/work-computer-toolsets.md
          - Spec delivery traceability: verification/spec-delivery-traceability.md
          - Documentation workflow: verification/documentation-workflow.md
          - Project knowledge repair: verification/project-knowledge-repair.md
          - Repository organization: verification/repository-organization.md
          - Source fetch cleanup: verification/source-fetch-cleanup.md
          - Portable workflow bundle cleanup: verification/portable-workflow-bundle-cleanup.md
